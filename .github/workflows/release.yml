name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "CARD_VERSION = \"${TAG}\"" dist/claude-usage-card.js \
            || { echo "CARD_VERSION does not match tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: Attach card to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/claude-usage-card.js --clobber
